services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pii-gateway-api
    ports:
      - "${API_HOST_PORT:-8000}:8000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=8000
      - UVICORN_WORKERS=${UVICORN_WORKERS:-6}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://api.deepseek.com}
      - LLM_MODEL=${LLM_MODEL:-deepseek-chat}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - REDIS_SOCKET_TIMEOUT=0.2
      - REDIS_SOCKET_CONNECT_TIMEOUT=0.2
      # Ключ обязателен, без default. Memory fallback в этом контуре запрещён.
      - PAYLOAD_STORE_KEY=${PAYLOAD_STORE_KEY:?PAYLOAD_STORE_KEY is required}
      - PAYLOAD_STORE_ALLOW_MEMORY_FALLBACK=false
      - PAYLOAD_STORE_TTL_SECONDS=3600
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_DEFAULT_RPS=1500
      - RATE_LIMIT_BURST=2000
    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

    volumes:
      - pii_logs:/var/log/pii-gateway

    networks:
      - server_net

  redis:
    image: redis:7-alpine

    container_name: pii-gateway-redis
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    networks:
      - server_net

volumes:
  pii_logs:
  redis_data:
  pii_logs:
