services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pii-gateway-api
    environment:
      APP_HOST: ${APP_HOST:-0.0.0.0}
      APP_PORT: ${APP_PORT:-8000}

      LLM_API_KEY: ${LLM_API_KEY:?LLM_API_KEY is required}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-30}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-3}
      LLM_RETRY_DELAY: ${LLM_RETRY_DELAY:-1}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}

      PAYLOAD_STORE_KEY: ${PAYLOAD_STORE_KEY:?PAYLOAD_STORE_KEY is required}
      PAYLOAD_STORE_TTL_SECONDS: ${PAYLOAD_STORE_TTL_SECONDS:-3600}
      PAYLOAD_STORE_ALLOW_MEMORY_FALLBACK: ${PAYLOAD_STORE_ALLOW_MEMORY_FALLBACK:-false}

      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-100}
      REDIS_SOCKET_TIMEOUT: ${REDIS_SOCKET_TIMEOUT:-0.2}
      REDIS_SOCKET_CONNECT_TIMEOUT: ${REDIS_SOCKET_CONNECT_TIMEOUT:-0.2}

      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_DEFAULT_RPS: ${RATE_LIMIT_DEFAULT_RPS:-1500}
      RATE_LIMIT_BURST: ${RATE_LIMIT_BURST:-2000}
      RATE_LIMIT_KEY_PREFIX: ${RATE_LIMIT_KEY_PREFIX:-pii_gateway:ratelimit:}

      NATASHA_ENABLED: ${NATASHA_ENABLED:-true}
      NATASHA_CONFIDENCE_THRESHOLD: ${NATASHA_CONFIDENCE_THRESHOLD:-0.85}

      PRESIDIO_ENABLED: ${PRESIDIO_ENABLED:-true}
      PRESIDIO_CONFIDENCE_THRESHOLD: ${PRESIDIO_CONFIDENCE_THRESHOLD:-0.8}
      PRESIDIO_LANGUAGE: ${PRESIDIO_LANGUAGE:-ru}

      REGEX_ENABLED: ${REGEX_ENABLED:-true}

      COMPOSITE_STRATEGY: ${COMPOSITE_STRATEGY:-priority}
      COMPOSITE_DEDUPLICATE: ${COMPOSITE_DEDUPLICATE:-true}
      COMPOSITE_MIN_CONFIDENCE: ${COMPOSITE_MIN_CONFIDENCE:-0.75}

      MASKER_TOKEN_PREFIX: ${MASKER_TOKEN_PREFIX:-[}
      MASKER_TOKEN_SUFFIX: ${MASKER_TOKEN_SUFFIX:-]}
      MASKER_TOKEN_FORMAT: ${MASKER_TOKEN_FORMAT:-{type}_{index}}
      MASKER_PRESERVE_CASE: ${MASKER_PRESERVE_CASE:-false}
      MASKER_PRESERVE_LENGTH: ${MASKER_PRESERVE_LENGTH:-false}

      PIPELINE_MAX_TEXT_LENGTH: ${PIPELINE_MAX_TEXT_LENGTH:-100000}
      PIPELINE_MAX_ENTITIES_PER_REQUEST: ${PIPELINE_MAX_ENTITIES_PER_REQUEST:-500}
      PIPELINE_LLM_TIMEOUT: ${PIPELINE_LLM_TIMEOUT:-25}
      PIPELINE_TOTAL_TIMEOUT: ${PIPELINE_TOTAL_TIMEOUT:-28}
      
      PII_SANITIZATION: ${PII_SANITIZATION:-true}
      UVICORN_WORKERS: ${UVICORN_WORKERS:-4}

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/health"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

    restart: unless-stopped

    volumes:
      - pii_logs:/var/log/pii-gateway

    networks:
      - server_net

  redis:
    image: redis:7-alpine

    container_name: pii-gateway-redis

    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 1gb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD is required}

    expose:
      - "6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 3s
      retries: 5

    restart: unless-stopped

    networks:
      - server_net

volumes:
  pii_logs:
  redis_data:

networks:
  server_net:
    name: server_net
    external: true  # Раскомментируй эту строку, если сеть 'server_net' создается вручную вне этого docker-compose
