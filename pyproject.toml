[project]
name = "pii-masking-gateway"
version = "0.1.0"
description = "High-load PII Masking Gateway for Alpha Bank Hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "pydantic-extra-types>=2.7.0",
    "pyyaml>=6.0",
    "structlog>=25.1.0",
    "python-json-logger>=2.0.0",
    "redis>=5.0.0",
    "httpx>=0.28.0",
    "prometheus-client>=0.20.0",
    "natasha>=1.6.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.28.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
fix = true

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "PT", "RUF", "SIM", "TID", "TRY"]
# TRY400: используем logger.error вместо logger.exception в обработчиках ошибок,
# чтобы не логировать traceback, который может содержать ПДн.
# TRY003: сообщения ValueError задаём инлайн (идиоматично для валидации).
ignore = ["S101", "S106", "S311", "RUF001", "RUF002", "RUF003", "TRY400", "TRY003"]
per-file-ignores = {"tests/*" = ["S101", "S106", "S311"]}

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"